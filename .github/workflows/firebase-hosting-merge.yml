# This file was auto-generated by the Firebase CLI
# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    # Evita que dos despliegues a 'live' se encimen (buena práctica).
    concurrency:
      group: firebase-hosting-live
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - run: npm ci && npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
      # Deploy directo con el CLI de Firebase.
      # NOTA: firebase-tools (v15.x) tiene un bug al desplegar a 'live': finaliza la versión
      # y la deja ACTIVA, pero luego hace una publicación redundante que falla con
      # 400 "is the current active version". El sitio SÍ queda actualizado; solo ese
      # paso redundante rompe el job. Por eso toleramos ESE error específico (y solo ese).
      - name: Deploy a Firebase Hosting (live)
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
          set +e
          salida=$(npx firebase-tools@latest deploy --only hosting --project sistema-pos-95051 --non-interactive 2>&1)
          codigo=$?
          echo "$salida"
          if [ $codigo -ne 0 ] && echo "$salida" | grep -q "is the current active version"; then
            echo "::notice::La versión ya quedó activa (publicación redundante de firebase-tools). El sitio está actualizado; se ignora el error no fatal."
            exit 0
          fi
          exit $codigo
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SISTEMA_POS_95051 }}
